<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05080a">
<style>
/* Colors from SatelliteTracker/Shared/Theme.swift. The app is dark only. */
:root{
  --bg:#05080a;
  --glow:#0c1712;       /* accent over bg, for the page gradient */
  --glow-cool:#0e1518;
  --card:#12171a;       /* Theme.panel */
  --tile:#1c2124;       /* Theme.panelHigh */
  --text:#ffffff;
  --muted:#a8a8a8;      /* Theme.textSecondary */
  --rule:rgba(255,255,255,.10);   /* Theme.hairline */
  --accent:#5cc773;     /* Theme.accent */
  --amber:#ebb542;      /* Theme.amber */
  --chip:rgba(255,255,255,.06);
  --chip-on:#1c2124;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(115% 55% at 100% 0%, var(--glow-cool) 0%, transparent 62%),
    linear-gradient(172deg, var(--glow) 0%, var(--bg) 46%, var(--bg) 100%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.wrap{max-width:46rem;margin:0 auto;padding:0 18px}

header.bar{padding:30px 0 22px;text-align:center}
header.bar .app{
  margin:0;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:-0.02em;
}
header.bar .sub{
  margin:3px 0 0;
  color:var(--muted);
  font-size:.88rem;
  letter-spacing:.01em;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}
nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:999px;
  background:var(--chip);
  color:var(--muted);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  transition:color .15s, background .15s;
}
nav a:hover{color:var(--accent)}
nav a.here{
  background:var(--chip-on);
  color:var(--accent);
  font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}

main.card{
  background:var(--card);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:38px 34px 34px;
  margin-bottom:26px;
}

main.card > :first-child{margin-top:0}
h1{font-size:1.8rem;line-height:1.25;letter-spacing:-0.025em;margin:0 0 .65em;font-weight:700}
h2{font-size:1.24rem;margin:2.1em 0 .5em;letter-spacing:-0.015em;font-weight:650}
h3{font-size:1.03rem;margin:1.9em 0 .4em;font-weight:650}
p,li{overflow-wrap:break-word}
li{margin:.3em 0}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--text)}
strong{font-weight:650}
hr{border:0;border-top:1px solid var(--rule);margin:2.3em 0}

code{
  background:var(--tile);
  color:var(--text);
  padding:.14em .4em;
  border-radius:5px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
td code{white-space:nowrap}   /* a coordinate must not break across lines */

table{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:.94rem}
th,td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left}
thead th{
  background:transparent;
  color:var(--muted);
  font-weight:600;
  font-size:.86rem;
  letter-spacing:.02em;
  text-transform:uppercase;
  border-bottom:1px solid var(--rule);
}
tbody tr:last-child td{border-bottom:0}

blockquote{
  margin:1.3em 0;
  padding:.6em 0 .6em 1.1em;
  border-left:3px solid var(--amber);
  color:var(--muted);
}
blockquote p{margin:.3em 0}

footer{
  padding:4px 0 54px;
  color:var(--muted);
  font-size:.86rem;
  text-align:center;
}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent);text-decoration:underline}
footer p{margin:.3em 0}

@media (max-width:560px){
  .wrap{padding:0 14px}
  header.bar{padding:22px 0 16px}
  main.card{padding:26px 20px 24px;border-radius:20px}
  h1{font-size:1.5rem}
  h2{font-size:1.14rem}
  nav a{padding:6px 13px;font-size:.86rem}
  table{display:block;overflow-x:auto;font-size:.88rem}   /* scroll inside the card, not the page */
  th,td{padding:8px 6px}
  td code{font-size:.8em;padding:.14em .3em}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="bar">
    <p class="app">GPS Test Satellite Tracker</p>
    <p class="sub">Live satellite radar &amp; GPS status</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </header>

  <main class="card">
{{ content }}
  </main>

  <footer>
    <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
    <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
  </footer>

</div>

</body>
</html>
